<section>
  <h2>Carrito</h2>

  <p *ngIf="carritoService.getCarrito().length === 0">Tu carrito esta vacio.</p>

  <div *ngFor="let item of carritoService.getCarrito()" class="item">
    <h4>{{ item.nombre }}</h4>
    <p>Precio: {{ item.precio | currency }}</p>
    <p>Cantidad: {{ item.cantidad }}</p>
    <p>Subtotal: {{ item.precio * item.cantidad | currency }}</p>
    <button (click)="eliminar(item.id)">Eliminar</button>
  </div>

  <h2>Total: {{ carritoService.total() | currency }}</h2>
</section>
