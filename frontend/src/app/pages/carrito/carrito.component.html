<section>
  <h2>Carrito de compras</h2>

  <table *ngIf="items.length > 0; else empty">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio</th>
        <th>Subtotal</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.producto.nombre }}</td>
        <td>{{ item.cantidad }}</td>
        <td>${{ item.producto.precio }}</td>
        <td>${{ item.cantidad * item.producto.precio }}</td>
        <td>
          <button type="button" (click)="eliminar(item.producto.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #empty>
    <p>No hay productos en el carrito.</p>
  </ng-template>

  <h3>Total: ${{ total() }}</h3>
</section>
