<section class="catalog-header">
  <div>
    <h2>Catálogo</h2>
    <p>Encuentra suplementos y accesorios diseñados para tu mejor desempeño.</p>
  </div>
  <div>
    <span>Últimas ofertas disponibles</span>
  </div>
</section>

<section class="catalog-banner">
  <div>
    <strong>10% OFF</strong> en compras seleccionadas.
  </div>
  <div>Envío rápido y seguro a todo México.</div>
</section>

<section class="search-box">
  <input
    type="text"
    [(ngModel)]="busqueda"
    placeholder="Buscar por nombre, categoria o marca"
  >
</section>

<section>
  <p *ngIf="cargando">Cargando productos...</p>

  <div class="grid" *ngIf="!cargando">
    <app-producto-card
      *ngFor="let producto of productosFiltrados"
      [producto]="producto"
      (agregar)="agregarAlCarrito($event)">
    </app-producto-card>
  </div>
</section>
