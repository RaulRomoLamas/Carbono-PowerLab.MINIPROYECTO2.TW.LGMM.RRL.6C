<section>
  <h2>Contacto</h2>

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <input type="text" placeholder="Nombre" formControlName="nombre">
    <input type="email" placeholder="Correo" formControlName="correo">
    <input type="text" placeholder="Asunto" formControlName="asunto">
    <textarea placeholder="Mensaje" formControlName="mensaje"></textarea>
    <button type="submit">Enviar mensaje</button>
  </form>

  <p>{{ mensaje }}</p>
</section>
