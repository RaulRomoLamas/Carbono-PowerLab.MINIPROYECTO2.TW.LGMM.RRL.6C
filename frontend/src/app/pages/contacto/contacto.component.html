<section>
  <h2>Contacto</h2>

  <form #formContacto="ngForm" (ngSubmit)="enviar()">
    <input
      type="text"
      name="nombre"
      [(ngModel)]="contacto.nombre"
      required
      placeholder="Nombre"
    >

    <input
      type="email"
      name="correo"
      [(ngModel)]="contacto.correo"
      required
      placeholder="Correo"
    >

    <input
      type="text"
      name="asunto"
      [(ngModel)]="contacto.asunto"
      required
      placeholder="Asunto"
    >

    <textarea
      name="mensaje"
      [(ngModel)]="contacto.mensaje"
      required
      placeholder="Mensaje"
    ></textarea>

    <button type="submit" [disabled]="formContacto.invalid">Enviar</button>
  </form>

  <p *ngIf="mensajeConfirmacion">
    {{ mensajeConfirmacion }}
  </p>
</section>
